<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Componente: barra de navegación del cliente</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<header style="position: relative; z-index: 5; background: #0F172A; color: #FFFFFF; font-family: Inter, system-ui, sans-serif">
<div style="max-width: 1200px; margin: 0 auto; padding: 12px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; font-weight: 800; font-size: 19px; letter-spacing: -0.01em">
<span style="width: 36px; height: 36px; border-radius: 10px; background: #2563EB; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path></svg></span>
TiendaVirtual</a>

<div style="flex: 1 1 280px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 10px; padding: 0 6px 0 12px; height: 44px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<label for="nav-q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar productos</label>
<input id="nav-q" type="search" value="{{ q }}" onChange="{{ onQ }}" placeholder="Buscar portátiles, celulares, accesorios…" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 15px; color: #0F172A; outline: none; min-width: 0">
<a href="Catalogo.dc.html" style="display: flex; align-items: center; height: 34px; padding: 0 12px; border-radius: 8px; background: #2563EB; color: #FFFFFF; font-weight: 700; font-size: 14px; text-decoration: none">Buscar</a>
</div>

<nav aria-label="Principal" style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px">
<div style="position: relative">
<button type="button" aria-expanded="{{ open }}" aria-haspopup="true" onClick="{{ toggle }}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; color: #FFFFFF; background: {{ catBg }}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"></rect><rect x="14" y="4" width="6" height="6" rx="1"></rect><rect x="4" y="14" width="6" height="6" rx="1"></rect><rect x="14" y="14" width="6" height="6" rx="1"></rect></svg>
Categorías
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; top: 50px; left: 0; width: 220px; background: #FFFFFF; color: #0F172A; border: 1px solid #E2E8F0; border-radius: 12px; padding: 6px; box-shadow: 0 12px 32px rgba(15,23,42,0.18); display: flex; flex-direction: column">
<a href="Catalogo.dc.html" style="padding: 10px 12px; border-radius: 8px; text-decoration: none; color: #0F172A; font-weight: 600; font-size: 14px">Computadores</a>
<a href="Catalogo.dc.html" style="padding: 10px 12px; border-radius: 8px; text-decoration: none; color: #0F172A; font-weight: 600; font-size: 14px">Celulares</a>
<a href="Catalogo.dc.html" style="padding: 10px 12px; border-radius: 8px; text-decoration: none; color: #0F172A; font-weight: 600; font-size: 14px">Monitores</a>
<a href="Catalogo.dc.html" style="padding: 10px 12px; border-radius: 8px; text-decoration: none; color: #0F172A; font-weight: 600; font-size: 14px">Accesorios</a>
</div>
</sc-if>
</div>
<a href="Seguimiento.dc.html" aria-current="{{ curPedidos }}" style="display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #FFFFFF; font-weight: 600; font-size: 15px; background: {{ pedidosBg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5 9 5 9-5z"></path><path d="M3 8v8l9 5 9-5V8"></path><path d="M12 13v8"></path></svg>Mis pedidos</a>
<a href="Compra.dc.html" aria-current="{{ curCarrito }}" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; color: #FFFFFF; font-weight: 600; font-size: 15px; background: {{ carritoBg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"></circle><circle cx="18" cy="20" r="1.5"></circle><path d="M3 4h2l2.5 11h11L21 8H6.2"></path></svg>Carrito <span style="min-width: 22px; text-align: center; background: #2563EB; color: #FFFFFF; border-radius: 999px; padding: 1px 7px; font-size: 13px; font-weight: 700">{{ cartCount }}</span></a>
<sc-if value="{{ guest }}" hint-placeholder-val="{{ true }}">
<a href="Login.dc.html" style="display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 10px; text-decoration: none; color: #0F172A; background: #FFFFFF; font-weight: 700; font-size: 15px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Ingresar</a>
</sc-if>
<sc-if value="{{ logged }}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; gap: 10px; padding-left: 8px; border-left: 1px solid #334155; margin-left: 4px">
<span style="width: 34px; height: 34px; border-radius: 999px; background: #DBEAFE; color: #1E3A8A; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">{{ initials }}</span>
<div style="display: flex; flex-direction: column; line-height: 1.2">
<span style="font-weight: 700; font-size: 14px">{{ user }}</span>
<a href="Login.dc.html" style="color: #BFDBFE; font-size: 13px; font-weight: 600">Cerrar sesión</a>
</div>
</div>
</sc-if>
</nav>
</div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["","catalogo","pedidos","carrito"],"default":""},"cartCount":{"editor":"int","default":2},"user":{"editor":"text","default":""},"q":{"editor":null},"onQ":{"editor":null},"$preview":{"width":1280,"height":68}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { open: false, q: '' }; }
  renderVals() {
    var self = this, p = this.props, a = p.active || '';
    var user = p.user || '';
    var parts = user.split(' ');
    return {
      open: this.state.open,
      toggle: function () { self.setState({ open: !self.state.open }); },
      catBg: this.state.open || a === 'catalogo' ? '#1E293B' : 'transparent',
      pedidosBg: a === 'pedidos' ? '#1E293B' : 'transparent',
      carritoBg: a === 'carrito' ? '#1E293B' : 'transparent',
      curPedidos: a === 'pedidos' ? 'page' : 'false',
      curCarrito: a === 'carrito' ? 'page' : 'false',
      cartCount: p.cartCount == null ? 2 : p.cartCount,
      q: p.q != null ? p.q : this.state.q,
      onQ: p.onQ || function (e) { self.setState({ q: e.target.value }); },
      user: user, guest: !user, logged: !!user,
      initials: parts.map(function (w) { return w.charAt(0); }).join('').slice(0, 2).toUpperCase()
    };
  }
}
</script>
</body>
</html>
