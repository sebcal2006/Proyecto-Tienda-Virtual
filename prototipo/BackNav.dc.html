<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Componente: menú del back-office por rol</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<nav aria-label="Menú del back-office" style="height: 100%; min-height: 640px; box-sizing: border-box; background: #0F172A; color: #CBD5E1; padding: 18px 14px; display: flex; flex-direction: column; gap: 4px; font-family: Inter, system-ui, sans-serif">
<a href="{{ home }}" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #FFFFFF; font-weight: 800; font-size: 17px; padding: 6px 8px 14px">
<span style="width: 32px; height: 32px; border-radius: 9px; background: #2563EB; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8"></path><path d="M12 16v4"></path></svg></span>TiendaVirtual</a>
<span style="margin: 0 8px 10px; align-self: flex-start; padding: 4px 10px; border-radius: 999px; background: #1E293B; border: 1px solid #334155; color: #BFDBFE; font-size: 12px; font-weight: 700">{{ roleName }}</span>
<sc-for list="{{ items }}" as="it" hint-placeholder-count="6">
<sc-if value="{{ it.enabled }}" hint-placeholder-val="{{ true }}">
<a href="{{ it.href }}" aria-current="{{ it.current }}" style="display: flex; align-items: center; justify-content: space-between; min-height: 44px; padding: 0 12px; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 15px; background: {{ it.bg }}; color: {{ it.color }}">{{ it.label }}<sc-if value="{{ it.badge }}" hint-placeholder-val="{{ false }}"><span style="background: #F59E0B; color: #0F172A; border-radius: 999px; padding: 1px 8px; font-size: 12px; font-weight: 800">{{ it.badge }}</span></sc-if></a>
</sc-if>
<sc-if value="{{ it.disabled }}" hint-placeholder-val="{{ false }}">
<span aria-disabled="true" style="display: flex; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 12px; font-size: 15px; color: #94A3B8; cursor: not-allowed">{{ it.label }}<span style="white-space: nowrap; font-size: 11px; font-weight: 700; color: #94A3B8; border: 1px solid #334155; border-radius: 6px; padding: 1px 6px">Próx.</span></span>
</sc-if>
</sc-for>
<div style="margin-top: auto; padding: 14px 8px 0; border-top: 1px solid #1E293B; display: flex; flex-direction: column; gap: 6px">
<div style="font-weight: 700; color: #FFFFFF; font-size: 14px">{{ person }}</div>
<div style="font-size: 13px; color: #94A3B8">{{ roleName }}</div>
<a href="Login.dc.html" style="color: #BFDBFE; font-size: 14px; font-weight: 700">Cerrar sesión</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"role":{"editor":"enum","options":["admin","vendedor","inventario","facturacion"],"default":"admin"},"active":{"editor":"text","default":"dashboard"},"$preview":{"width":240,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var role = this.props.role || 'admin', active = this.props.active || '';
    var I = {
      dashboard: ['Dashboard', 'Dashboard.dc.html'], pedidos: ['Pedidos', 'Pedidos.dc.html'], pos: ['Venta presencial', 'VentaPresencial.dc.html'],
      productos: ['Productos', 'ProductoForm.dc.html'], inventario: ['Inventario', 'Inventario.dc.html'], movimientos: ['Movimientos', 'Movimientos.dc.html'],
      facturas: ['Facturas', 'Facturas.dc.html'], usuarios: ['Usuarios y roles', ''], reportes: ['Reportes', ''], clientes: ['Clientes', '']
    };
    var ROLES = {
      admin: { name: 'Administrador', person: 'Carlos Admin', keys: ['dashboard', 'pedidos', 'productos', 'inventario', 'movimientos', 'facturas', 'usuarios', 'reportes'] },
      vendedor: { name: 'Vendedor', person: 'Sofía Vendedora', keys: ['pos', 'pedidos', 'clientes'] },
      inventario: { name: 'Encargado de inventario', person: 'Mario Inventario', keys: ['inventario', 'movimientos'] },
      facturacion: { name: 'Encargado de facturación', person: 'Elena Facturación', keys: ['facturas'] }
    };
    var r = ROLES[role] || ROLES.admin;
    return {
      roleName: r.name, person: r.person, home: I[r.keys[0]][1],
      items: r.keys.map(function (k) {
        var on = k === active, href = I[k][1];
        return { label: I[k][0], href: href, enabled: !!href, disabled: !href, current: on ? 'page' : 'false',
          bg: on ? '#2563EB' : 'transparent', color: on ? '#FFFFFF' : '#E2E8F0',
          badge: k === 'facturas' && role === 'facturacion' ? '1' : '' };
      })
    };
  }
}
</script>
</body>
</html>
