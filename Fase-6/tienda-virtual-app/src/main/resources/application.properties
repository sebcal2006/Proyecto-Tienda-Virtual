spring.application.name=tienda-virtual
server.port=8080

# Base de datos creada con Fase-4/database/tienda_virtual.sql
spring.datasource.url=jdbc:mysql://localhost:3306/virtual_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# El esquema lo crea el script SQL; la aplicación no lo modifica.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false
spring.messages.encoding=UTF-8
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Los usuarios del script traen un hash de ejemplo. Al iniciar, la app les asigna
# las claves de prueba reales: Tienda123 (personal) y Cliente123 (clientes).
app.demo.passwords=true
