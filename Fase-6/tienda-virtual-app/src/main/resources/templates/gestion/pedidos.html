<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Pedidos')}"></head>
<body class="staff">
<aside th:replace="~{fragments :: staffNav('pedidos')}"></aside>
<main class="content">
    <div th:replace="~{fragments :: flash}"></div>
    <h1>Pedidos</h1>
    <form class="filters" th:action="@{/gestion/pedidos}" method="get">
        <select name="estado">
            <option value="">Todos los estados</option>
            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == estado}"></option>
        </select>
        <select name="canal">
            <option value="">Todos los canales</option>
            <option th:each="c : ${channels}" th:value="${c}" th:text="${c.label}" th:selected="${c == canal}"></option>
        </select>
        <button class="btn">Filtrar</button>
        <a class="btn ghost" th:href="@{/gestion/pedidos}" th:if="${estado != null or canal != null}">Limpiar</a>
    </form>
    <div class="card">
        <p class="empty" th:if="${orders.isEmpty()}">No hay pedidos con esos filtros.</p>
        <table th:unless="${orders.isEmpty()}">
            <thead><tr><th>Pedido</th><th>Fecha</th><th>Cliente</th><th>Canal</th><th>Estado</th><th>Pago</th><th class="r">Total</th><th></th></tr></thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td><b th:text="${o.code}"></b></td>
                <td th:text="${#temporals.format(o.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                <td th:text="${o.customer.name}"></td>
                <td th:text="${o.channel.label}"></td>
                <td><span class="badge" th:classappend="${o.status.css}" th:text="${o.status.label}"></span></td>
                <td th:text="${o.channel.name() == 'IN_STORE'} ? 'En tienda' : (${o.paid} ? 'Aprobado' : 'Pendiente')"></td>
                <td class="r" th:text="${@fmt.money(o.total)}"></td>
                <td><a th:href="@{/gestion/pedidos/{id}(id=${o.id})}">Detalle</a></td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
